<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Contagem decrescente</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app">
    <div class="timer" role="timer" aria-live="off">
        <div class="unit"><div class="num" id="d">00</div><div class="label">dias</div></div>
        <div class="unit"><div class="num" id="h">00</div><div class="label">horas</div></div>
        <div class="unit"><div class="num" id="m">00</div><div class="label">minutos</div></div>
        <div class="unit"><div class="num" id="s">00</div><div class="label">segundos</div></div>
    </div>
    <div class="done">Chegou o dia.</div>
</main>
<script src="script.js"></script>
</body>
</html>
